<style>
.lost{min-height:calc(100vh - 130px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding-bottom:40px}
/* three cards on a shelf spelling 4·0·4; a random subset collapses, with physics. */
.deck404{position:relative;display:flex;align-items:flex-end;gap:22px;height:200px;cursor:pointer;border-radius:10px}
.deck404:focus-visible{outline:2px solid var(--accent);outline-offset:12px}
.deck404::after{content:"";position:absolute;left:-28px;right:-28px;bottom:0;border-bottom:1px solid var(--line2)}
.c404{position:relative;width:120px;height:164px;border-radius:var(--r3);background:linear-gradient(165deg,#1a1812,#0e0d0a);border:1px solid var(--line2);display:grid;place-items:center;box-shadow:0 18px 40px rgba(0,0,0,.5);will-change:transform}
.c404::before{content:"";position:absolute;inset:8px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}
.c404::after{content:"";position:absolute;inset:0;border-radius:var(--r3);background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:13px 13px;pointer-events:none}
.c404 .d{font-family:var(--mono);font-size:3.6rem;font-weight:600;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.paws{position:absolute;right:-96px;bottom:6px;display:flex;gap:13px;align-items:flex-end;opacity:0;transition:opacity .45s}
.paws.go{opacity:.6}
.paws svg{width:18px;height:18px;color:var(--accentdim)}
.mrrp404{position:absolute;right:-58px;top:8px;font-family:var(--mono);font-size:.6875rem;color:var(--ink);background:var(--surface-1);border:1px solid var(--line2);border-radius:var(--r1);padding:6px 10px;opacity:0;transform:translateY(5px);transition:opacity .22s,transform .22s var(--eout);pointer-events:none;white-space:nowrap}
.mrrp404.show{opacity:1;transform:none}

.lost h1{font-size:clamp(1.5rem,4.4vw,1.875rem);font-weight:600;color:var(--ink);letter-spacing:-.02em;margin-top:46px;line-height:1.1}
.lost .hint{font-family:var(--mono);font-size:.6875rem;color:var(--mut);opacity:0;transition:opacity .4s}
.lost .hint.on{opacity:1}
.lost .cta{margin-top:18px}
@media(max-width:640px){
  .lost{min-height:calc(100vh - 150px)}
  .deck404{gap:12px;height:150px}
  .c404{width:62px;height:86px;border-radius:var(--r2)}
  .c404::before{inset:6px;border-radius:7px}
  .c404 .d{font-size:2rem}
  .paws{right:-2px;bottom:-4px;gap:10px}
  .paws svg{width:15px;height:15px}
  .mrrp404{right:-6px;top:-4px}
}
@media(prefers-reduced-motion:reduce){.paws{opacity:.6}}
</style>
</head>
<body>
<div class="page">

  <header class="bar rv">
    <nav><a href="index.html">home</a><a href="work.html">work</a><a href="writing.html">writing</a></nav>
    <span class="right"><span class="clock" id="clock">Bengaluru</span><span class="status"><span class="pulse"></span>open to 0→1 roles</span></span>
  </header>

  <main class="lost">
    <div class="deck404" id="deck" role="button" tabindex="0" aria-label="knock the cards over again">
      <div class="c404"><span class="d">4</span></div>
      <div class="c404"><span class="d">0</span></div>
      <div class="c404"><span class="d">4</span></div>
      <span class="paws"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="9" r="2"/><circle cx="11" cy="6.5" r="2"/><circle cx="16.5" cy="8" r="2"/><path d="M11.5 11c-3 0-5.5 2-5.5 4.6 0 1.8 1.7 2.7 2.8 2 .9-.6 1-1 2.7-1s1.8.4 2.7 1c1.1.7 2.8-.2 2.8-2 0-2.6-2.5-4.6-5.5-4.6z"/></svg><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="9" r="2"/><circle cx="11" cy="6.5" r="2"/><circle cx="16.5" cy="8" r="2"/><path d="M11.5 11c-3 0-5.5 2-5.5 4.6 0 1.8 1.7 2.7 2.8 2 .9-.6 1-1 2.7-1s1.8.4 2.7 1c1.1.7 2.8-.2 2.8-2 0-2.6-2.5-4.6-5.5-4.6z"/></svg><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="9" r="2"/><circle cx="11" cy="6.5" r="2"/><circle cx="16.5" cy="8" r="2"/><path d="M11.5 11c-3 0-5.5 2-5.5 4.6 0 1.8 1.7 2.7 2.8 2 .9-.6 1-1 2.7-1s1.8.4 2.7 1c1.1.7 2.8-.2 2.8-2 0-2.6-2.5-4.6-5.5-4.6z"/></svg></span>
      <span class="mrrp404" id="mrrp404">mrrp.</span>
    </div>

    <h1>this page fell off the shelf.</h1>
    <p class="hint" id="hint">tap to knock it over again</p>
    <a class="cta" href="index.html">→ back home</a>
  </main>

</div>
<script src="assets/v3.js"></script>
<script>
(function(){
  var deck=document.getElementById('deck'), mrrp=document.getElementById('mrrp404'),
      hint=document.getElementById('hint'), paws=deck.querySelector('.paws');
  var cards=[].slice.call(deck.querySelectorAll('.c404'));
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var busy=false;
  function R(a,b){ return a+Math.random()*(b-a); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function mobile(){ return window.matchMedia('(max-width:640px)').matches; }
  function settle(a){ try{ a.commitStyles(); a.cancel(); }catch(e){} }
  function nowT(c){ return getComputedStyle(c).transform; }

  function scatterPaws(){
    [].forEach.call(paws.querySelectorAll('svg'), function(p){
      p.style.transform='rotate('+(22+R(-10,16)).toFixed(0)+'deg) translateY('+R(-3,5).toFixed(0)+'px)';
    });
  }

  /* a contained plan for how card i collapses, by mode */
  function plan(i, mode){
    var m=mobile(), o={tx:0,ty:0,spin:0,origin:'50% 100%',rot:0};
    if(mode==='tipR'){ o.origin='50% 100%'; o.rot=R(84,96);  o.tx=R(0,6);  o.ty=R(0,4); }
    else if(mode==='tipL'){ o.origin='50% 100%'; o.rot=-R(84,96); o.tx=-R(0,6); o.ty=R(0,4); }
    else if(mode==='slip'){ o.origin='50% 50%'; o.rot=(Math.random()<.5?1:-1)*R(18,40); o.tx=R(-7,7); o.ty=R(8,22); }
    else if(mode==='leanR'){ o.origin='88% 100%'; o.rot=R(46,66); o.tx=R(0,4); }
    else if(mode==='leanL'){ o.origin='12% 100%'; o.rot=-R(46,66); o.tx=-R(0,4); }
    else if(mode==='tumbleR'){ o.origin='50% 50%'; o.rot=90;  o.spin=360+R(20,80); o.tx=R(-4,6); o.ty=(m?12:22)+R(-2,5); }
    else if(mode==='tumbleL'){ o.origin='50% 50%'; o.rot=-90; o.spin=-(360+R(20,80)); o.tx=R(-6,4); o.ty=(m?12:22)+R(-2,5); }
    return o;
  }
  /* contained modes per slot: edge cards only fall inward */
  var MODES=[
    ['tipR','slip','leanR','tumbleR','tumbleL'],
    ['tipR','tipL','slip','leanR','leanL','tumbleR','tumbleL'],
    ['tipL','slip','leanL','tumbleR','tumbleL']
  ];

  function topple(card, i, mode, delay){
    var p=plan(i,mode);
    card.style.transformOrigin=p.origin;
    var base='translate('+p.tx.toFixed(1)+'px,'+p.ty.toFixed(1)+'px) ';
    var kf, dur;
    if(p.spin){
      dur=780+R(0,260);
      kf=[
        {transform:'translate(0,0) rotate(0deg)', offset:0, easing:'cubic-bezier(.5,.05,.9,.5)'},
        {transform:base+'rotate('+(p.spin*0.7).toFixed(1)+'deg)', offset:.55, easing:'linear'},
        {transform:base+'rotate('+(p.rot+(p.rot>0?12:-12)).toFixed(1)+'deg)', offset:.83, easing:'cubic-bezier(.3,.6,.4,1)'},
        {transform:base+'rotate('+p.rot.toFixed(1)+'deg)', offset:1}
      ];
    } else {
      dur=640+R(0,280);
      var b=R(5,12), s=p.rot>=0?1:-1;
      kf=[
        {transform:'translate(0,0) rotate(0deg)', offset:0, easing:'cubic-bezier(.55,.06,.95,.5)'},
        {transform:base+'rotate('+(p.rot+s*b).toFixed(1)+'deg)', offset:.6, easing:'cubic-bezier(.3,.5,.4,1)'},
        {transform:base+'rotate('+(p.rot-s*b*0.4).toFixed(1)+'deg)', offset:.76, easing:'ease-in-out'},
        {transform:base+'rotate('+(p.rot+s*b*0.12).toFixed(1)+'deg)', offset:.9, easing:'ease-out'},
        {transform:base+'rotate('+p.rot.toFixed(1)+'deg)', offset:1}
      ];
    }
    var a=card.animate(kf,{duration:dur,delay:delay||0,fill:'forwards'});
    a.onfinish=function(){ settle(a); };
  }

  function standTilt(card){
    card.style.transformOrigin='50% 100%';
    var a=card.animate([{transform:nowT(card)},{transform:'rotate('+R(-2,2).toFixed(2)+'deg)'}],{duration:420,easing:'ease-out',fill:'forwards'});
    a.onfinish=function(){ settle(a); };
  }

  /* pick a different way for the shelf to fail, every time */
  function collapse(){
    var scenario=pick(['solo','solo','pair','all','domino','middrop']);
    var fallers=[];
    if(scenario==='solo'){
      var i=Math.floor(R(0,3)); fallers.push({i:i,mode:pick(MODES[i]),delay:0});
    } else if(scenario==='pair'){
      var pairs=[[0,1],[1,2],[0,2]]; var pr=pick(pairs);
      fallers.push({i:pr[0],mode:pick(MODES[pr[0]]),delay:R(0,80)},{i:pr[1],mode:pick(MODES[pr[1]]),delay:R(140,280)});
    } else if(scenario==='all'){
      [0,1,2].forEach(function(i,k){ fallers.push({i:i,mode:pick(MODES[i]),delay:k*R(110,200)}); });
    } else if(scenario==='domino'){
      var dir=Math.random()<.5; var order=dir?[0,1,2]:[2,1,0];
      order.forEach(function(i,k){ var mode=i===0?'tipR':i===2?'tipL':(dir?'tipR':'tipL'); fallers.push({i:i,mode:mode,delay:k*R(140,220)}); });
    } else { /* middrop: the 0 goes, the 4s lean in after */
      fallers.push({i:1,mode:pick(['slip','tumbleR','tumbleL']),delay:0},{i:0,mode:'leanR',delay:R(90,190)},{i:2,mode:'leanL',delay:R(90,190)});
    }
    var falling={}; fallers.forEach(function(f){ falling[f.i]=1; topple(cards[f.i],f.i,f.mode,f.delay); });
    cards.forEach(function(c,i){ if(!falling[i]) standTilt(c); });
  }

  function dealIn(cb){
    cards.forEach(function(c,i){
      c.style.transformOrigin='50% 100%';
      var a=c.animate([{opacity:0,transform:'translateY(-26px) rotate(-4deg)'},{opacity:1,transform:'none'}],{duration:520,delay:i*120,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'});
      a.onfinish=function(){ settle(a); };
    });
    setTimeout(cb, 520+240+Math.round(R(520,820)));
  }
  function standAll(cb){
    cards.forEach(function(c,i){
      c.style.transformOrigin='50% 100%';
      var a=c.animate([{transform:nowT(c)},{transform:'rotate(0deg) translate(0,0)'}],{duration:430,delay:i*70,easing:'cubic-bezier(.34,1.5,.5,1)',fill:'forwards'});
      a.onfinish=function(){ settle(a); };
    });
    setTimeout(cb, 430+140+Math.round(R(360,640)));
  }

  if(reduce){
    cards[2].style.transformOrigin='50% 50%';
    cards[2].style.transform = mobile() ? 'rotate(90deg) translateY(14px)' : 'rotate(88deg) translateY(22px)';
    paws.classList.add('go'); hint.classList.add('on'); return;
  }

  scatterPaws();
  dealIn(function(){ collapse(); paws.classList.add('go'); setTimeout(function(){ hint.classList.add('on'); },600); });

  function replay(){
    if(busy) return; busy=true; hint.classList.remove('on');
    standAll(function(){ scatterPaws(); collapse(); mrrp.classList.add('show');
      setTimeout(function(){ mrrp.classList.remove('show'); hint.classList.add('on'); busy=false; },1600); });
  }
  deck.addEventListener('click',replay);
  deck.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); replay(); } });
})();
</script>
</body></html>
