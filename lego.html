  /* One visual, one line. The page builds itself out of bricks and
     never finishes, which is the only joke it needs.
     Real brick geometry: 8mm stud pitch, studs 4.8mm across. */
  .wip{padding:var(--s6) 0 var(--s7);display:flex;flex-direction:column;align-items:center;text-align:center}
  .stage{--u:34px;position:relative;width:calc(var(--u) * 7);height:calc(var(--u) * 4.8);margin-bottom:2.4rem}
  .brick{
    position:absolute;height:calc(var(--u) * .92);border-radius:2px;
    opacity:0;animation:lay 9s cubic-bezier(.3,1.5,.5,1) infinite;
    animation-delay:calc(var(--i) * .15s);
  }
  .brick .body{position:absolute;inset:0;border-radius:2px;background:var(--c);
    box-shadow:inset 0 calc(var(--u) * -.14) 0 rgba(0,0,0,.19),inset 0 calc(var(--u) * .1) 0 rgba(255,255,255,.24),
               inset calc(var(--u) * -.09) 0 0 rgba(0,0,0,.11),0 3px 6px -3px rgba(28,28,25,.5)}
  .brick .studs{position:absolute;left:0;right:0;top:calc(var(--u) * -.2);height:calc(var(--u) * .2);display:flex}
  .brick .studs s{flex:1;display:block;position:relative}
  .brick .studs s::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:0;
    width:calc(var(--u) * .58);height:100%;border-radius:2px 2px 0 0;background:var(--c);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset calc(var(--u) * -.06) 0 0 rgba(0,0,0,.13)}
  @keyframes lay{
    0%   {opacity:0;transform:translate(0,calc(var(--u) * -1.7))}
    5%   {opacity:1;transform:translate(0,0)}
    58%  {opacity:1;transform:translate(0,0) rotate(0)}
    72%  {opacity:0;transform:translate(var(--x),calc(var(--u) * 2)) rotate(var(--r))}
    100% {opacity:0;transform:translate(var(--x),calc(var(--u) * 2)) rotate(var(--r))}
  }
  .wip h1{font-size:2rem;letter-spacing:-.03em;margin-bottom:.6rem}
  .wip p{color:var(--soft);max-width:27rem;font-size:1.02rem}
  .wip .cta{display:flex;gap:1.4rem;margin-top:1.7rem;font-family:var(--mono);font-size:.74rem}
  .wip .cta a{color:var(--soft);text-decoration:none}
  .wip .cta a:hover{color:var(--red)}
  @media(max-width:640px){

    .wip .cta{flex-direction:column;gap:.75rem;align-items:center}

  @media(prefers-reduced-motion:reduce){
    .brick{animation:none;opacity:1;transform:none}
