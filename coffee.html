<style>
.cof-head{padding:40px 0 2px}
.cof-title{font-size:clamp(1.8rem,5vw,2.1rem);font-weight:600;color:var(--ink);letter-spacing:-.02em;line-height:1.06}
.cof-sub{margin-top:16px;font-size:1.2rem;color:var(--read);line-height:1.6;max-width:52ch}
.cof-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:24px 0 24px}
.seg{display:inline-flex;background:var(--surface-1);border:1px solid var(--line2);border-radius:12px;padding:3px}
.seg button{font-family:var(--mono);font-size:.75rem;font-weight:500;color:var(--mut);background:none;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.18s}
.seg button.on{background:var(--accent);color:#1a1206;font-weight:500}
.seg button:not(.on):hover{color:var(--ink)}
.cof-count{font-family:var(--mono);font-size:.75rem;color:var(--mut)}.cof-count b{color:var(--accent)}

/* MAP VIEW */
.mapview{display:grid;grid-template-columns:1.45fr 1fr;gap:22px;align-items:stretch}
.mapview[hidden]{display:none}
#map{height:540px;border-radius:16px;border:1px solid var(--line2);overflow:hidden;background:#0c0b09;z-index:0}
/* map view: the detail card matches the map's height as a balanced pair;
   the photo fills the space above a fixed-height text body */
.mapview .ccard{height:540px;display:flex;flex-direction:column}
.mapview .cc-photo{flex:1 1 auto;aspect-ratio:auto;min-height:150px}
.mapview .cc-body{flex:0 0 auto}
.leaflet-container{background:#0c0b09;font-family:var(--mono)}
.leaflet-control-attribution{background:rgba(13,13,12,.7)!important;color:#6b665b!important;font-size:9px!important}
.leaflet-control-attribution a{color:#8a8478!important}
.cpin{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;background:#1a1206;border:2px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:.72rem;font-weight:600;cursor:pointer;transition:transform .25s var(--eout),background .2s;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:drop .5s var(--eout) backwards}
@keyframes drop{from{opacity:0;transform:translateY(-16px) scale(.6)}to{opacity:1;transform:none}}
.cpin:hover{transform:scale(1.12)}
.cpin.sel{background:var(--accent);color:#1a1206;transform:scale(1.18)}
.cpin.sel::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);animation:ping2 2s ease-out infinite}
@keyframes ping2{0%{opacity:.7;transform:scale(.7)}70%,100%{opacity:0;transform:scale(1.9)}}
@media(prefers-reduced-motion:reduce){.cpin{animation:none}.cpin.sel::after{animation:none;opacity:0}}

/* THE CARD (shared) — a framed photo header over a text body; floats over the map, so shadow is earned */
.ccard{position:relative;background:linear-gradient(165deg,var(--surface-2),#100e0a);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 20px 44px rgba(0,0,0,.5)}
.cc-photo{position:relative;aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid var(--line2);background:var(--surface-2)}
.cc-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cc-photo-empty{display:grid;place-items:center;background:radial-gradient(120% 120% at 50% 0,#241a0e,#120f0a)}
.cc-photo-empty::after{content:"";position:absolute;inset:0;opacity:.45;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:22px 22px}
.cc-ph-ico{position:relative;color:var(--accent);opacity:.5}
.cc-rank{position:absolute;left:13px;top:12px;z-index:2;font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--accent);background:rgba(13,13,12,.62);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:6px;padding:3px 9px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cc-body{padding:20px 22px 18px}
.cc-name{font-family:var(--sans);font-size:1.5rem;font-weight:600;color:var(--ink);letter-spacing:-.015em;line-height:1.1}
.cc-area{font-family:var(--mono);font-size:.6875rem;color:var(--mut);margin-top:8px;display:flex;align-items:center;gap:6px}
.cc-vd{font-size:1.0625rem;color:var(--read);line-height:1.6;margin-top:14px}
.cc-order{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.cc-ord{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:baseline}
.cc-k{font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.cc-v{font-size:.9375rem;color:var(--ink);font-weight:500;line-height:1.45}
.cc-maps{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.75rem;font-weight:500;color:var(--accent);text-decoration:none;margin-top:20px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:8px;padding:9px 14px;transition:.18s}
.cc-maps:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent)}
.swap{animation:swap .42s var(--eout)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* GALLERY */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;perspective:1200px}
.gallery[hidden]{display:none}
.gcard{display:flex;transform-style:preserve-3d;transition:transform .3s var(--eout),box-shadow .3s;cursor:default}
.gcard .ccard{flex:1;display:flex;flex-direction:column;transition:box-shadow .3s}
.gallery .cc-body{flex:1;display:flex;flex-direction:column}
.gallery .cc-maps{margin-top:auto;align-self:flex-start}
.gcard:hover{box-shadow:0 34px 60px rgba(0,0,0,.55)}
.gcard:hover .ccard{box-shadow:0 34px 60px rgba(0,0,0,.55),0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.gcard.in{animation:rise2 .55s var(--eout) backwards}
@keyframes rise2{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.gcard.in{animation:none}.gcard{transition:none}}

@media(max-width:820px){
  .mapview{grid-template-columns:1fr;gap:18px}
  #map{height:300px}
  .mapview .ccard{height:auto}
  .mapview .cc-photo{flex:none;aspect-ratio:16/10}
}
@media(max-width:640px){
  .cof-head{padding:28px 0 2px}.cof-bar{margin:20px 0 18px}
  .gallery{grid-template-columns:1fr;perspective:none}
  .gcard{transform:none!important}
  .cc-foot{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body class="coffee">
<div class="page">

  <header class="bar rv">
    <nav><a href="index.html">home</a><a href="work.html">work</a><a href="writing.html">writing</a></nav>
    <span class="right"><span class="clock" id="clock">Bengaluru</span><span class="status">over-caffeinated</span></span>
  </header>

  <section class="cof-head rv">
    <p class="eyebrow">// off the clock</p>
    <h1 class="cof-title">the coffee crawl.</h1>
    <p class="cof-sub">where to actually drink coffee in Bengaluru. ranked, obviously. opinions mine, the caffeine is talking.</p>
  </section>

  <div class="cof-bar rv">
    <div class="seg" role="tablist">
      <button class="on" data-view="map" role="tab" aria-selected="true"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2L2 4v10l4-2 4 2 4-2V2l-4 2-4-2z"/><path d="M6 2v10M10 4v10"/></svg> map</button>
      <button data-view="gallery" role="tab" aria-selected="false"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg> cards</button>
    </div>
    <span class="cof-count"><b id="cofN">6</b> places · sorted by how often i go back</span>
  </div>

  <section class="mapview rv" id="mapview">
    <div id="map"></div>
    <div class="ccard" id="detail"></div>

  <section class="gallery" id="gallery" hidden></section>

  <footer class="foot reveal">

    <span class="fr" id="openk">press <kbd>⌘K</kbd> for quick actions</span>
  </footer>

</div>
<script src="assets/v3.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function(){
  var DATA=[
    {nm:'Maverick & Farmer',area:'Koramangala',lat:12.9345,lng:77.6270,img:'',
     drink:'Maverick Mazegran, or the tender coconut cold brew',
     food:'bird\'s eye chilli spaghetti',
     vd:'my go-to place to work from. probably the best coffee, food and vibe in town.'},
    {nm:'Anama Coffee',area:'Indiranagar',lat:12.9783,lng:77.6395,img:'',
     drink:'raspberry cold brew',
     food:'lemon cloud cookie',
     vd:'my daily hangout, where i go to chill with friends.'},
    {nm:'Kahale',area:'Jayanagar',lat:12.9285,lng:77.5835,img:'',
     drink:'cranberry foam cold brew, or a hazelnut iced latte',
     vd:'a late-night favourite, open till 1am with a great vibe. some of the best coffee in town.'}
  ];
  var rank=function(i){return (i+1<10?'0':'')+(i+1);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;';});};
  var mapsUrl=function(d){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.nm+' '+d.area+' bengaluru');};
  var STAR='<svg width="9" height="9" viewBox="0 0 10 10" fill="currentColor"><path d="M5 0l1.5 3 3.5.3-2.6 2.3.8 3.4L5 7.6 1.8 9l.8-3.4L0 3.3 3.5 3z"/></svg>';
  var PIN='<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 11c2.5-3 4-4.7 4-7a4 4 0 1 0-8 0c0 2.3 1.5 4 4 7z"/><circle cx="6" cy="4" r="1.3"/></svg>';
  var CUP='<svg class="cc-ph-ico" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 8.5h11V13a4.2 4.2 0 0 1-4.2 4.2H8.7A4.2 4.2 0 0 1 4.5 13z"/><path d="M15.6 10h1.4a2.4 2.4 0 0 1 0 4.8h-1.1"/><path d="M7 3.4c-.6 .9 .6 1.5 0 2.4M10.2 3.4c-.6 .9 .6 1.5 0 2.4"/><path d="M4 20h12"/></svg>';
  function cardHTML(d,i){
    var head=d.img
      ? '<div class="cc-photo"><img src="assets/img/coffee/'+esc(d.img)+'" alt="'+esc(d.nm)+', '+esc(d.area)+'" loading="lazy"><span class="cc-rank">'+rank(i)+'</span></div>'
      : '<div class="cc-photo cc-photo-empty"><span class="cc-rank">'+rank(i)+'</span>'+CUP+'</div>';
    var order='<div class="cc-order"><div class="cc-ord"><span class="cc-k">drink</span><span class="cc-v">'+esc(d.drink)+'</span></div>';
    if(d.food){ order+='<div class="cc-ord"><span class="cc-k">eat</span><span class="cc-v">'+esc(d.food)+'</span></div>'; }
    order+='</div>';
    return head
      +'<div class="cc-body">'
      +'<h3 class="cc-name">'+esc(d.nm)+'</h3>'
      +'<div class="cc-area">'+PIN+' '+esc(d.area)+'</div>'
      +'<p class="cc-vd">'+esc(d.vd)+'</p>'
      +order
      +'<a class="cc-maps" href="'+mapsUrl(d)+'" target="_blank" rel="noopener">open in maps ↗</a>'
      +'</div>';
  }
  function fillBars(){}

  /* ---- map ---- */
  var detail=document.getElementById('detail'), cur=-1, markers=[], map;
  function select(i,pan){
    if(i===cur)return; cur=i; var d=DATA[i];
    detail.innerHTML=cardHTML(d,i); detail.classList.remove('swap'); void detail.offsetWidth; detail.classList.add('swap');
    fillBars(detail);
    markers.forEach(function(m,j){ var el=m.getElement&&m.getElement(); if(el){var p=el.querySelector('.cpin');if(p)p.classList.toggle('sel',j===i);} });
    if(map&&pan!==false) map.panTo([d.lat,d.lng],{animate:true,duration:.6});
  }
  try{
    map=L.map('map',{zoomControl:false,scrollWheelZoom:false,attributionControl:true}).setView([12.948,77.625],12);
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
      subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
    DATA.forEach(function(d,i){
      var icon=L.divIcon({className:'',html:'<div class="cpin" style="animation-delay:'+(i*0.06)+'s">'+rank(i)+'</div>',iconSize:[30,30]});
      /* keyboard:true + a title makes each pin focusable and named; the cards view is
         the fuller accessible path (real buttons, links), but the map is operable too. */
      var m=L.marker([d.lat,d.lng],{icon:icon,keyboard:true,title:d.nm,alt:d.nm+', '+d.area}).addTo(map);
      m.bindTooltip(d.nm,{direction:'top',offset:[0,-14],className:'ctt'});
      m.on('click',function(){select(i);});
      m.on('keypress',function(e){ if(e.originalEvent&&(e.originalEvent.key==='Enter'||e.originalEvent.key===' ')){ e.originalEvent.preventDefault(); select(i); } });
      markers.push(m);
    });
    var bounds=DATA.map(function(d){return [d.lat,d.lng];});
    function fit(){ if(!map)return; map.invalidateSize(); map.fitBounds(bounds,{padding:[48,48]}); }
    fit(); setTimeout(fit,250); setTimeout(fit,800);
  }catch(e){ document.getElementById('map').innerHTML='<div style="padding:24px;font-family:var(--mono);font-size:.8rem;color:var(--mut)">map could not load — try the cards view.</div>'; }
  select(0,false);

  /* ---- gallery ---- */
  var gal=document.getElementById('gallery'), built=false;
  function buildGallery(){
    if(built)return; built=true;
    DATA.forEach(function(d,i){
      var w=document.createElement('article'); w.className='gcard';
      w.innerHTML='<div class="ccard">'+cardHTML(d,i)+'</div>';
      gal.appendChild(w);
      var cc=w.querySelector('.ccard');
      w.addEventListener('pointermove',function(e){ if(window.matchMedia('(max-width:640px)').matches)return; var r=w.getBoundingClientRect(); var px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5; w.style.transform='rotateY('+(px*7)+'deg) rotateX('+(-py*7)+'deg) translateY(-6px)'; });
      w.addEventListener('pointerleave',function(){ w.style.transform=''; });
    });
    requestAnimationFrame(function(){ gal.querySelectorAll('.gcard').forEach(function(c,i){ c.style.animationDelay=(i*0.07)+'s'; c.classList.add('in'); }); fillBars(gal); });
  }

  /* ---- toggle ---- */
  var segs=document.querySelectorAll('.seg button'), mv=document.getElementById('mapview');
  segs.forEach(function(b){ b.addEventListener('click',function(){
    segs.forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b?'true':'false');});
    var g=b.dataset.view==='gallery';
    if(g){ buildGallery(); gal.hidden=false; mv.hidden=true; }
    else { mv.hidden=false; gal.hidden=true; if(map){ setTimeout(function(){ map.invalidateSize(); },30); } }
  });});

  document.getElementById('cofN').textContent=DATA.length;
})();
</script>
