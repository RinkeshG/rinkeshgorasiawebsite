<!DOCTYPE html><html><head><meta charset="UTF-8"><title>cat + garden test</title>
<style>
  body{background:#FCFCF9;padding:60px;font-family:monospace}
  .rowset{display:flex;gap:70px;align-items:flex-end;margin-bottom:80px}
  .c{position:relative}
  .base{height:2px;background:#1C1C19;position:absolute;bottom:0;left:-15px}
  .c small{position:absolute;bottom:-26px;left:0;color:#97958A}
  .ink{stroke:#1C1C19;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:#FCFCF9}
  .whisk{stroke:#1C1C19;stroke-width:.9;fill:none;opacity:.6}
  .eye{fill:#1C1C19;stroke:none}
</style></head><body>

<div class="rowset">
  <!-- SIT — back view, tail curled -->
  <div class="c" style="width:120px;height:130px">
    <div class="base" style="width:150px"></div>
    <svg viewBox="0 0 48 56" width="96" height="112" style="position:absolute;bottom:2px;left:12px">
      <path class="ink" d="M19 12 L14.5 3 L22 9.5 C23 9 25 9 26 9.5 L33.5 3 L29 12
        C33 21 36 38 39 53 L9 53 C12 38 15 21 19 12 Z"/>
      <path class="ink" d="M38 52 C47 50 48 40 41 39 C37 38.5 35 41 35.5 44" style="fill:none"/>
      <path class="whisk" d="M20 9 L20.5 6.5 M28 9 L27.5 6.5"/>
    </svg>
    <small>SIT</small>
  </div>

  <!-- LOAF — front dome, face + tucked paws -->
  <div class="c" style="width:150px;height:130px">
    <div class="base" style="width:180px"></div>
    <svg viewBox="0 0 72 44" width="132" height="80" style="position:absolute;bottom:2px;left:8px">
      <path class="ink" d="M6 43 C6 22 18 15 36 15 C54 15 66 22 66 43 Z"/>
      <path class="ink" d="M16 20 L12 8 L26 17 M56 20 L60 8 L46 17"/>
      <path class="ink" d="M64 42 C70 41 70 45 63 44" style="fill:none"/>
      <circle class="eye" cx="29" cy="27" r="1.7"/><circle class="eye" cx="43" cy="27" r="1.7"/>
      <path class="whisk" d="M36 31 v2 M30 32 l-9 -2 M30 33 l-9 1 M42 32 l9 -2 M42 33 l9 1"/>
      <path class="ink" d="M28 43 q4 -5 8 0 M36 43 q4 -5 8 0" style="fill:none"/>
    </svg>
    <small>LOAF</small>
  </div>

  <!-- SLEEP — curl, tail over, closed eyes -->
  <div class="c" style="width:160px;height:100px">
    <div class="base" style="width:190px"></div>
    <svg viewBox="0 0 72 36" width="140" height="70" style="position:absolute;bottom:2px;left:8px">
      <path class="ink" d="M5 34 C5 16 22 9 40 13 C55 16 64 23 64 34 Z"/>
      <path class="ink" d="M45 15 L47 7 L53 15 M52 15 L55 8 L60 16"/>
      <path class="ink" d="M6 33 C2 22 14 17 26 20 C38 23 47 20 52 15" style="fill:none"/>
      <path class="ink" d="M50 20 q3 2 6 0" style="fill:none;stroke-width:1.2"/>
    </svg>
    <small>SLEEP</small>
  </div>
</div>

<!-- SUNFLOWER PATCH -->
<div class="c" style="width:340px;height:170px">
  <div class="base" style="width:380px"></div>
  <svg viewBox="0 0 200 120" width="360" height="150" style="position:absolute;bottom:2px;left:0">
    <defs>
      <g id="p1"><path d="M0 -17 C2.6 -11 2.6 -7 0 -4 C-2.6 -7 -2.6 -11 0 -17 Z"/></g>
      <g id="p2"><path d="M0 -13 C2.2 -8.5 2.2 -5 0 -3 C-2.2 -5 -2.2 -8.5 0 -13 Z"/></g>
      <g id="p3"><path d="M0 -9 C1.6 -6 1.6 -4 0 -2.5 C-1.6 -4 -1.6 -6 0 -9 Z"/></g>
    </defs>
    <g stroke="#1C1C19" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round">
      <!-- back small, turned -->
      <path d="M150 48 C149 68 151 88 150 118" stroke="#5F6F44" stroke-width="1.6" fill="none"/>
      <g transform="translate(150,42)" fill="#E9B63C">
        <use href="#p2"/><use href="#p2" transform="rotate(45)"/><use href="#p2" transform="rotate(90)"/><use href="#p2" transform="rotate(135)"/>
        <use href="#p2" transform="rotate(180)"/><use href="#p2" transform="rotate(225)"/><use href="#p2" transform="rotate(270)"/><use href="#p2" transform="rotate(315)"/>
        <circle r="6" fill="#5E4327"/></g>

      <!-- tall center -->
      <path d="M95 34 C93 62 97 90 95 118" stroke="#5F6F44" stroke-width="1.8" fill="none"/>
      <path d="M95 70 C86 66 80 71 82 78 C89 78 93 75 95 72 Z" fill="#7A8B55" stroke="#5F6F44"/>
      <path d="M95 88 C104 84 110 89 108 96 C101 97 97 93 95 90 Z" fill="#7A8B55" stroke="#5F6F44"/>
      <g transform="translate(95,26)">
        <g fill="#E9B63C"><use href="#p1"/><use href="#p1" transform="rotate(30)"/><use href="#p1" transform="rotate(60)"/><use href="#p1" transform="rotate(90)"/>
          <use href="#p1" transform="rotate(120)"/><use href="#p1" transform="rotate(150)"/><use href="#p1" transform="rotate(180)"/>
          <use href="#p1" transform="rotate(210)"/><use href="#p1" transform="rotate(240)"/><use href="#p1" transform="rotate(270)"/>
          <use href="#p1" transform="rotate(300)"/><use href="#p1" transform="rotate(330)"/></g>
        <circle r="8" fill="#5E4327"/><circle r="5" fill="none" stroke="#8A6A42" stroke-width=".8" stroke-dasharray="1.1 1.4"/></g>

      <!-- short bud -->
      <path d="M45 70 C44 88 46 102 45 118" stroke="#5F6F44" stroke-width="1.4" fill="none"/>
      <path d="M45 92 C38 89 34 93 36 98 C41 98 44 95 45 93 Z" fill="#7A8B55" stroke="#5F6F44"/>
      <g transform="translate(45,66)" fill="#E9B63C">
        <use href="#p3"/><use href="#p3" transform="rotate(51)"/><use href="#p3" transform="rotate(102)"/><use href="#p3" transform="rotate(153)"/>
        <use href="#p3" transform="rotate(204)"/><use href="#p3" transform="rotate(255)"/><use href="#p3" transform="rotate(306)"/>
        <circle r="4.2" fill="#5E4327"/></g>
    </g>
  </svg>
  <small style="bottom:-26px">SUNFLOWER PATCH</small>
</div>

</body></html>
